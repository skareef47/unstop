[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "psai-backend"
version = "0.1.0"
description = "PSAI — AI-Powered Technical Support & Troubleshooting Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.1",
    "pgvector>=0.3.5",
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
    "pypdf>=4.3.1",
    "numpy>=1.26.4",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "openai>=1.51.0",
    "groq>=0.11.0",
    "google-genai>=0.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
